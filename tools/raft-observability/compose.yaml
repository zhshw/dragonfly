name: dragonfly-observability

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://172.31.23.2:3007}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  web:
    image: docker.langfuse.com/langfuse/langfuse:4.83.0
    restart: "on-failure:3"
    depends_on: *dependencies
    ports: ["${OBSERVABILITY_BIND:-0.0.0.0}:3007:3000"]
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: dragonfly
      LANGFUSE_INIT_ORG_NAME: Dragonfly
      LANGFUSE_INIT_PROJECT_ID: dragonfly-performance
      LANGFUSE_INIT_PROJECT_NAME: Raft and cluster performance
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@local.test}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.83.0
    restart: "on-failure:3"
    depends_on: *dependencies
    environment: *langfuse-env
    logging: *logging

  postgres:
    image: postgres:17
    restart: "on-failure:3"
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/postgres
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    user: "101:101"
    restart: "on-failure:3"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/clickhouse
        target: /var/lib/clickhouse
        bind: {create_host_path: false}
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/clickhouse-logs
        target: /var/log/clickhouse-server
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  minio:
    image: cgr.dev/chainguard/minio
    user: "1000:1000"
    restart: "on-failure:3"
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MC_HOST_local: http://langfuse:${MINIO_PASSWORD}@localhost:9000
      MC_CONFIG_DIR: /tmp/mc
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/minio
        target: /data
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  redis:
    image: redis:7
    restart: "on-failure:3"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/redis
        target: /data
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  artifacts:
    image: nginx:1.28-alpine
    restart: "on-failure:3"
    ports: ["${OBSERVABILITY_BIND:-0.0.0.0}:3137:80"]
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/artifacts
        target: /usr/share/nginx/html
        read_only: true
        bind: {create_host_path: false}
    logging: *logging
