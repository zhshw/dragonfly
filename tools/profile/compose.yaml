name: dragonfly-observability

x-readonly-bind: &readonly-bind
  type: bind
  read_only: true
  bind: {create_host_path: false}

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://172.31.23.2:3007}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  web:
    container_name: profile-langfuse
    image: docker.langfuse.com/langfuse/langfuse:4.83.0
    restart: "on-failure:3"
    depends_on: *dependencies
    ports: ["${OBSERVABILITY_BIND:-0.0.0.0}:3007:3000"]
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: dragonfly
      LANGFUSE_INIT_ORG_NAME: Dragonfly
      LANGFUSE_INIT_PROJECT_ID: dragonfly-performance
      LANGFUSE_INIT_PROJECT_NAME: Raft and cluster performance
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@local.test}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  worker:
    container_name: profile-worker
    image: docker.langfuse.com/langfuse/langfuse-worker:4.83.0
    restart: "on-failure:3"
    depends_on: *dependencies
    environment: *langfuse-env
    logging: *logging

  postgres:
    container_name: profile-postgres
    image: postgres:17
    restart: "on-failure:3"
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/postgres
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  clickhouse:
    container_name: profile-clickhouse
    image: clickhouse/clickhouse-server:26.3.62.3
    user: "101:101"
    restart: "on-failure:3"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/clickhouse
        target: /var/lib/clickhouse
        bind: {create_host_path: false}
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/clickhouse-logs
        target: /var/log/clickhouse-server
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  minio:
    container_name: profile-minio
    image: cgr.dev/chainguard/minio
    user: "1000:1000"
    restart: "on-failure:3"
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MC_HOST_local: http://langfuse:${MINIO_PASSWORD}@localhost:9000
      MC_CONFIG_DIR: /tmp/mc
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/minio
        target: /data
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  redis:
    container_name: profile-redis
    image: redis:7
    restart: "on-failure:3"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/redis
        target: /data
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  artifacts:
    container_name: profile-artifacts
    image: nginx:1.28-alpine
    restart: "on-failure:3"
    ports: ["${OBSERVABILITY_BIND:-0.0.0.0}:3137:80"]
    volumes:
      - type: bind
        source: ${LANGFUSE_STORAGE_ROOT}/artifacts
        target: /usr/share/nginx/html
        read_only: true
        bind: {create_host_path: false}
    logging: *logging

  profile-init:
    container_name: profile-init
    profiles: [profile]
    image: postgres:17
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/bash", "/setup-postgres.sh"]
    environment:
      PROFILE_UID: ${PROFILE_UID:-1000}
      PROFILE_GID: ${PROFILE_GID:-1000}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - {<<: *readonly-bind, source: ./ops/setup-postgres.sh, target: /setup-postgres.sh}
      - ${PROFILE_ROOT:-/data/dragonfly-observability}/config:/config
      - ${LANGFUSE_STORAGE_ROOT}/raft-workflow:/archive
      - profile-runtime:/runtime
    logging: *logging

  profile-web:
    container_name: profile-web
    profiles: [profile]
    image: ${PROFILE_WEB_IMAGE:-docker.m.daocloud.io/library/ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db}
    restart: unless-stopped
    depends_on:
      profile-init: {condition: service_completed_successfully}
      web: {condition: service_started}
      worker: {condition: service_started}
      artifacts: {condition: service_started}
    user: "${PROFILE_UID:-1000}:${PROFILE_GID:-1000}"
    ports: ["${PROFILE_LISTEN:-0.0.0.0:8787}:8787"]
    entrypoint: ["/opt/profile-web"]
    command:
      - -listen
      - 0.0.0.0:8787
      - -web
      - /opt/profile-ui
      - -dsn-file
      - /data/dragonfly-observability/config/raft-workflow.dsn
      - -executor-socket
      - /run/profile-executor/executor.sock
      - -data
      - ${LANGFUSE_STORAGE_ROOT}/raft-workflow/experiments
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - <<: *readonly-bind
        source: ${PROFILE_BINARY:-${PROFILE_HOME:-/home/zhangshenwang}/.local/bin/profile-web}
        target: /opt/profile-web
      - <<: *readonly-bind
        source: ${WEB_DIST:-./web/dist}
        target: /opt/profile-ui
      - profile-runtime:/data/dragonfly-observability/config:ro
      - ${LANGFUSE_STORAGE_ROOT}/raft-workflow:${LANGFUSE_STORAGE_ROOT}/raft-workflow:ro
      - <<: *readonly-bind
        source: ${PROFILE_EXECUTOR_DIR:-${PROFILE_ROOT:-/data/dragonfly-observability}/config/executor}
        target: /run/profile-executor
    healthcheck:
      test: ["CMD", "/opt/profile-web", "-check", "http://127.0.0.1:8787/api/v1/experiments"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *logging

volumes:
  profile-runtime:
