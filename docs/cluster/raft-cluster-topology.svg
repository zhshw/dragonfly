  <polygon points="382.00,101.00 375.66,109.71 371.40,102.94" fill="#195b98" />
  <polyline id="cp-rb" stroke="#195b98" fill="none" stroke-width="2" stroke-dasharray="5 4" points="648,145 578,101" />
