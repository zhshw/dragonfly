  <polygon points="133.00,290.00 137.00,300.00 129.00,300.00" fill="#287640" />
  <g id="rpc-a" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="middle" fill="#287640">
