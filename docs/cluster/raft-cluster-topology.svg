  <polygon points="701.00,360.00 697.00,350.00 705.00,350.00" fill="#287640" />
  <polyline id="cli-ma" stroke="#ae490f" fill="none" stroke-width="2" points="421,500 342,400 300,275" />
  <polygon points="300.00,275.00 306.98,283.21 299.39,285.75" fill="#ae490f" />
  <polyline id="cli-mb" stroke="#ae490f" fill="none" stroke-width="2" points="539,500 618,400 660,275" />
  <polygon points="660.00,275.00 660.61,285.75 653.02,283.21" fill="#ae490f" />
  <g id="lbl-cfg" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="middle" fill="#195b98">
