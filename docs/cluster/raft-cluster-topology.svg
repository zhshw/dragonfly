<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 603" width="960" height="603" role="img">
  <title>沿用 Dragonfly 两主两副本的 slot 布局，显示三个独立的 Raft 组</title>
  <rect width="960" height="603" fill="white" />
  <rect id="group-a" stroke="#287640" fill="#f5fbf7" stroke-width="2" x="38" y="145" width="304" height="310" rx="6" />
  <rect id="group-b" stroke="#287640" fill="#f5fbf7" stroke-width="2" x="618" y="145" width="304" height="310" rx="6" />
  <rect id="cp" stroke="#1971c2" fill="#a5d8ff" stroke-width="2" x="338" y="32" width="284" height="69" rx="6" />
  <g id="cp-t" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#195b98">
    <text x="480.0" y="56.0">元数据 Raft 组  ·  C1 / C2 / C3</text>
    <text x="480.0" y="77.6">多数派 2 / 3  ·  管理 slot 归属</text>
  </g>
  <rect id="ma" stroke="#2f9e44" fill="#b2f2bb" stroke-width="2" x="80" y="200" width="220" height="90" rx="6" />
  <g id="ma-t" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#192533">
