  </g>
  <g id="group-name-b" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#287640">
    <text x="770.0" y="168.0">数据 Raft 组 20   ·   多数派 2 / 2</text>
  </g>
