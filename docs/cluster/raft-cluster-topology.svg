    <text x="190.0" y="246.6">slots 0–8191</text>
    <text x="190.0" y="268.2">health: online</text>
  </g>
  <rect id="mb" stroke="#2f9e44" fill="#b2f2bb" stroke-width="2" x="660" y="200" width="220" height="90" rx="6" />
  <g id="mb-t" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" text-anchor="middle" fill="#192533">
    <text x="770.0" y="225.0">B  ·  当前 leader / voter</text>
    <text x="770.0" y="246.6">slots 8192–16383</text>
    <text x="770.0" y="268.2">health: online</text>
  </g>
  <rect id="ra" stroke="#1971c2" fill="#d0ebff" stroke-width="2" stroke-dasharray="5 4" x="80" y="360" width="220" height="70" rx="6" />
