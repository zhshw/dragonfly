    <text x="221.0" y="333.25">复制：Fetch ↔</text>
  </g>
  <polyline id="return-b" stroke="#287640" fill="none" stroke-width="2" points="713,360 713,290" />
  <polygon points="713.00,290.00 717.00,300.00 709.00,300.00" fill="#287640" />
  <g id="rpc-b" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="middle" fill="#287640">
    <text x="801.0" y="313.0">选举：Vote ↔</text>
    <text x="801.0" y="333.25">复制：Fetch ↔</text>
  </g>
  <g id="quorum-note" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="middle" fill="#192533">
